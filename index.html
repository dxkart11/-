<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>迁移通知｜时速网络</title>

  <!-- 兜底禁缓存 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noarchive" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />

  <style>
    :root { --bg:#fff; --fg:#111; --muted:#666; --border:#e5e5e5; --link:#0b57d0; --btn:#111; --btnfg:#fff; --radius:12px; }
    * { box-sizing:border-box }
    html, body { height:100% }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font: 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    a { color:var(--link); text-decoration:none }
    .wrap { max-width:720px; margin:0 auto; padding:24px 16px 100px }
    header { margin:8px 0 16px }
    h1 { font-size:18px; line-height:1.3; margin:0 0 6px; font-weight:700 }
    .note { color:var(--muted); font-size:13px }
    .card {
      border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:12px; background:#fff;
    }
    .list { margin:8px 0 0; padding:0 0 0 18px }
    .list li { margin:6px 0 }
    .btns { display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px }
    @media (min-width:520px){ .btns{ grid-template-columns:1fr 1fr } }
    .btn {
      display:block; text-align:center; padding:14px 12px; border-radius:10px;
      border:1px solid var(--fg); background:var(--btn); color:var(--btnfg); font-weight:700;
    }
    .btn.alt { background:#fff; color:var(--fg); border-color:#222 }
    .tip { background:#fafafa; border:1px solid var(--border); border-radius:10px; padding:10px; font-size:14px; margin-top:10px }
    footer { margin-top:18px; color:var(--muted); font-size:13px; text-align:center; padding-bottom:calc(12px + env(safe-area-inset-bottom)) }
    .dock {
      position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:1fr 1fr; gap:8px;
    }
    .dock a { display:block; text-align:center; padding:12px 10px; border:1px solid #222; border-radius:999px; color:#fff; background:#111; font-weight:700 }
    .dock a.alt { background:#fff; color:#111 }
    @media (min-width:760px){ .dock { display:none } }
    code { font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#f4f6f8; border:1px solid var(--border); padding:2px 6px; border-radius:6px; color:#111 }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <header>
      <h1>时速网络 · 迁移通知</h1>
      <div class="note">原“飞鸟加速”已整体迁移至“时速网络”。账号、余额、邀请关系均已同步。</div>
    </header>

    <section class="card" aria-labelledby="go">
      <h2 id="go" style="font-size:16px;margin:0 0 8px">入口</h2>
      <div class="btns">
        <a class="btn" href="https://shisuwangluo.com" target="_blank" rel="noopener">主入口 · shisuwangluo.com</a>
        <a class="btn alt" href="https://sswl.fun" target="_blank" rel="noopener">备用入口 · sswl.fun</a>
      </div>
      <div class="tip">原飞鸟账号可直接登录；首次使用前请先购买套餐以激活。</div>
    </section>

    <section class="card" aria-labelledby="info">
      <h2 id="info" style="font-size:16px;margin:0 0 8px">说明</h2>
      <ul class="list">
        <li>计费模式：采用 <strong>月租包段</strong>。</li>
        <li>客户端：iOS 请使用 <strong>Sing-box</strong>；其余第三方客户端仅提供降级节点。</li>
        <li>优惠：结算时输入优惠码 <code>10save</code>，立减 ¥10。</li>
      </ul>
    </section>

    <footer>
      需要帮助：请在官网提交工单或联系在线客服（建议附平台、客户端与问题时间点）。
    </footer>
  </main>

  <nav class="dock" aria-label="快速入口">
    <a href="https://shisuwangluo.com" target="_blank" rel="noopener">shisuwangluo.com</a>
    <a class="alt" href="https://sswl.fun" target="_blank" rel="noopener">sswl.fun</a>
  </nav>

  <!-- 极简 Service Worker：统一落地 + 绕过旧缓存 -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      // 以当前文档路径作为统一落地页
      const LANDING = new URL(location.href).pathname || '/';
      const VERSION = '2025-11-03T15:00:00+09:00'; // 每次发布可改这个值

      const swCode = `
        const LANDING='${LANDING}';
        const VERSION='${Date.now()}';

        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));

        self.addEventListener('fetch', e => {
          const req = e.request;
          const url = new URL(req.url);

          if (url.origin !== location.origin) return;

          // 统一把站内所有导航请求重定向到落地页
          if (req.mode === 'navigate' && url.pathname !== LANDING) {
            e.respondWith(fetch(LANDING + '?v=' + VERSION, { cache: 'reload' }));
            return;
          }

          // 其他请求强制从网络获取（尽力绕过本地/中间缓存）
          e.respondWith(fetch(req, { cache: 'reload' }));
        });
      `;
      const swURL = URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }));
      navigator.serviceWorker.register(swURL, { scope: '/' }).catch(()=>{});
    })();
  </script>
</body>
</html>
